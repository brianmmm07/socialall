<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf5ec">
<title>SocialAll</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.5 2.3a.6.6 0 0 1 1 0l2.8 5.7 6.3.9a.6.6 0 0 1 .3 1l-4.5 4.4 1 6.3a.6.6 0 0 1-.8.6L12 18.2l-5.6 3a.6.6 0 0 1-.8-.6l1-6.3L2.1 9.9a.6.6 0 0 1 .3-1l6.3-.9z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></symbol>
    <symbol id="i-comment" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a.8.8 0 0 0 1.2.7l12-7.5a.8.8 0 0 0 0-1.4l-12-7.5A.8.8 0 0 0 7 4.5Z"/></symbol>
    <symbol id="i-images" viewBox="0 0 24 24"><rect x="7" y="7" width="14" height="14" rx="2"/><path d="M3 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.8 9.8 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-disk" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M21.2 6.8a2.8 2.8 0 0 0-4-4L4 16l-1 5 5-1Z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
  </defs>
</svg>

<header class="bar">
  <a class="wordmark" href="/" aria-label="SocialAll home">Social<span>All</span></a>
  <form class="searchbox" id="search" role="search">
    <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="q" type="search" name="q" placeholder="Search a topic across five platforms" autocomplete="off" aria-label="Topic" required>
    <kbd aria-hidden="true">/</kbd>
  </form>
  <button class="btn" id="save" type="button" disabled>
    <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Save topic</span>
  </button>
</header>

<div class="shell">
  <nav class="rail" aria-label="Library">
    <button class="nav-item" id="nav-favs" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>
      <span>Favourites</span><span class="count" id="fav-count">0</span>
    </button>
    <h2 class="rail-heading">Topics</h2>
    <ul class="topics" id="topics"></ul>
    <p class="rail-empty" id="topics-empty">Saved topics appear here. Search something, then press Save topic.</p>
    <div class="rail-foot">
      <h2 class="rail-heading">Sources</h2>
      <ul class="sources" id="sources"></ul>
      <p class="storage" id="storage"></p>
      <p class="export">Export favourites: <a href="/api/favorites/export?format=md" download>Markdown</a> · <a href="/api/favorites/export?format=json" download>JSON</a></p>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="head">
      <div class="head-title">
        <h1 id="title">Find what people are posting</h1>
        <p class="sub" id="subtitle">One search pulls posts from X, Instagram, Xiaohongshu, TikTok and LinkedIn.</p>
      </div>
      <button class="btn ghost" id="refresh" type="button" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>Refresh</span>
      </button>
    </div>
    <div class="filters" id="filters" hidden>
      <div class="seg" id="kind" role="group" aria-label="Media type">
        <button type="button" data-kind="all" aria-pressed="true">All</button>
        <button type="button" data-kind="video" aria-pressed="false">Videos</button>
        <button type="button" data-kind="image" aria-pressed="false">Images</button>
        <button type="button" data-kind="text" aria-pressed="false">Text</button>
      </div>
      <div class="seg" id="sort" role="group" aria-label="Sort" hidden>
        <button type="button" data-sort="recent" aria-pressed="true">Recent</button>
        <button type="button" data-sort="top" aria-pressed="false">Top</button>
      </div>
      <label class="find" id="find" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="find-q" type="search" placeholder="Find in favourites" autocomplete="off" aria-label="Find in favourites">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Platforms"></div>
    </div>
    <div class="notice" id="notice" role="status" hidden></div>
    <div class="feed" id="feed" aria-live="polite"></div>
    <p class="nomatch" id="nomatch" hidden>No favourites match.</p>
    <div class="more" id="more" hidden><button class="btn ghost" type="button" id="more-btn">Show more</button></div>
  </main>
</div>

<dialog class="viewer" id="viewer" aria-label="Post">
  <div class="stage" id="stage"></div>
  <aside class="panel" id="panel"></aside>
  <button class="icon-btn close" type="button" id="viewer-close" aria-label="Close">
    <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
  </button>
  <button class="icon-btn step prev" type="button" id="post-prev" aria-label="Previous post" title="Previous post (↑)">
    <svg class="icon" aria-hidden="true"><use href="#i-left"/></svg>
  </button>
  <button class="icon-btn step next" type="button" id="post-next" aria-label="Next post" title="Next post (↓)">
    <svg class="icon" aria-hidden="true"><use href="#i-right"/></svg>
  </button>
</dialog>

<div class="toast" id="toast" role="alert" hidden></div>
</body>
</html>
